default_config:

logger:
  default: info
  logs:
    custom_components.zont_local: debug

input_number:
  zont_test_temperature:
    name: Тестовая температура ZONT
    min: -20
    max: 80
    step: 0.1
    initial: 22
    unit_of_measurement: "°C"

input_boolean:
  zont_test_door:
    name: Тестовая дверь ZONT

template:
  - sensor:
      - name: Тестовая температура для ZONT
        unique_id: zont_test_temperature_sensor
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: >
          {{ states('input_number.zont_test_temperature') | float(22) }}
  - binary_sensor:
      - name: Тестовая дверь для ZONT
        unique_id: zont_test_door_sensor
        device_class: door
        state: >
          {{ is_state('input_boolean.zont_test_door', 'on') }}
