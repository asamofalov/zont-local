send_command:
  name: Отправить команду
  description: Отправляет одну универсальную команду через постоянное WebSocket-соединение ZONT.
  fields:
    id:
      name: Идентификатор команды
      description: Идентификатор команды ZONT.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          mode: box
    cmd:
      name: Команда
      description: Значение команды, например «1 22.5» или «2957».
      required: true
      selector:
        text:

send_bulk:
  name: Отправить несколько команд
  description: Последовательно отправляет несколько универсальных команд ZONT.
  fields:
    commands:
      name: Команды
      description: Непустой список объектов с полями id и cmd.
      required: true
      selector:
        object:
      example: >
        [{"id": 4107, "cmd": "1 22.5"}, {"id": 4109, "cmd": "2957"}]
