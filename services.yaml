send_command:
  name: Send command
  description: Send one universal ZONT command via the persistent WebSocket connection.
  fields:
    id:
      name: Command ID
      description: ZONT command id.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          mode: box
    cmd:
      name: Command
      description: Command string to put into the "cmd" field (e.g. "1 22.5" or "2957").
      required: true
      selector:
        text:

send_bulk:
  name: Send bulk commands
  description: Send multiple universal ZONT commands sequentially via the persistent WebSocket connection.
  fields:
    commands:
      name: Commands
      description: "List of objects: [{id: 4107, cmd: \"1 22.5\"}, ...]"
      required: true
      selector:
        object:
      example: >
        [{"id": 4107, "cmd": "1 22.5"}, {"id": 4109, "cmd": "2957"}]
