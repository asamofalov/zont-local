[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.zont_local"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components/zont_local", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "S101"]
